# Two separate test layers, deliberately kept apart:
#
#   - test/*.spec.js  — the hand-rolled Playwright E2E regression suite
#     (test/run-all.js), run via `bun run test`. NOT Bun's own test
#     format, even though the *.spec.js naming happens to match Bun's
#     default test-file glob.
#   - test/unit/*.test.js — real Bun test-runner unit tests (bun:test's
#     describe/test/expect) for dependency-free logic, run via
#     `bun run test:unit` (= bare `bun test`, scoped here).
#
# Pointing Bun's test root at test/unit keeps a bare `bun test` out of
# test/*.spec.js entirely — otherwise it would "discover" those files
# too (same glob) and silently no-op them (0 pass / 0 fail, looking
# deceptively like a clean run) instead of actually running the
# Playwright suite. Always run the E2E suite via `bun run test`, never
# bare `bun test`.
[test]
root = "test/unit"
