<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Real ES modules now (see docs/modernization-plan.md Phase 1) —
     app.js imports everything it needs (state.js, home.js, router.js,
     which in turn imports every src/games/*.js) itself, so this is
     the one entrypoint. Needs an actual HTTP origin to resolve those
     imports (browsers block module imports over file://) — run
     `bun run dev` and open http://localhost:5173, don't double-click
     this file directly. -->
<script type="module" src="app.js"></script>
