# /etc/nginx/sites-available/retro — reverse proxy для онлайн-режима.
# Bun слушает 127.0.0.1:8787 (см. PORT в /etc/retro/env), наружу смотрит
# только nginx. TLS добавляет certbot: `certbot --nginx -d retro.example.com`.
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/retro
#   sudo ln -s /etc/nginx/sites-available/retro /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream retro_backend {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name retro.example.com;

    # Длинные жизни WS и advisory-таймеры игр
    client_max_body_size 1m;

    # WebSocket Mini App и проектора
    location /ws {
        proxy_pass http://retro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное: Mini App (/), проектор (/projector),
    # webhook Telegram (POST /bot), /healthz
    location / {
        proxy_pass http://retro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
